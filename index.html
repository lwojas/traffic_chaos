<!DOCTYPE html>
<html>
  <head>
    <title>ECS Engine</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script src="scripts/phaser.js"></script>
    <script src="scripts/init.js"></script>
    <script type="module" src="scripts/boot.js" defer></script>
    <!-- Theme fonts: Epilogue (Day/Night display), Plus Jakarta Sans + Space Grotesk (Day), JetBrains Mono (Cyberpunk). System fonts are the fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="scripts/traffic/ui/game-hud.css" />
    <link rel="stylesheet" href="scripts/traffic/ui/debug-panel.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background-color: #fef9f0;
      }
    </style>
  </head>
  <body>
    <!-- The game viewport: the engine canvas fills it, the HUD is anchored to it.
         Edge scrolling and the HUD layout are relative to this element, not the browser window. -->
    <div id="game-viewport">
      <div id="game-hud"></div>
    </div>
    <div id="debug-panel"></div>
  </body>
</html>
